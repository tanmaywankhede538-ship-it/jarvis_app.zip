name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jarvis_app.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: jarvis_android
        env:
          JARVIS_URL: ${{ secrets.JARVIS_URL }}
          JARVIS_TOKEN: ${{ secrets.JARVIS_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis_android/app/build/outputs/apk/debug/app-debug.apk
